name: Build Windows Executable (.exe)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build Core
        run: npm run build --workspace=packages/core

      - name: Build Web Frontend
        run: npm run build --workspace=packages/web

      - name: Build Backend
        run: npm run build --workspace=packages/backend

      - name: Bundle Backend CJS
        run: npx esbuild packages/backend/src/server.ts --bundle --platform=node --target=node18 --format=cjs --outfile=packages/desktop-electron/server-bundle.cjs

      - name: Copy Web Dist to Desktop Electron
        run: |
          mkdir packages\desktop-electron\public
          xcopy /E /I packages\web\dist packages\desktop-electron\public

      - name: Package Windows Desktop App (.exe)
        run: npx -y @electron/packager packages/desktop-electron Orbit --platform=win32 --arch=x64 --electron-version=33.2.0 --out=dist-electron --overwrite

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Windows-App
          path: dist-electron/Orbit-win32-x64/
