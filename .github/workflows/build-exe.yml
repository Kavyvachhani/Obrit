name: Build Windows Executable (.exe)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build Core
        run: npm run build --workspace=packages/core

      - name: Build Web Frontend
        run: npm run build --workspace=packages/web

      - name: Build Backend
        run: npm run build --workspace=packages/backend

      - name: Bundle Backend CJS
        run: npx esbuild packages/backend/src/server.ts --bundle --platform=node --target=node18 --format=cjs --outfile=packages/desktop-electron/server-bundle.cjs

      - name: Copy Web Dist to Desktop Electron
        run: |
          mkdir packages\desktop-electron\public
          xcopy /E /I packages\web\dist packages\desktop-electron\public

      - name: Build Windows Standalone Installer & Portable Exe
        run: npx electron-builder --win --x64 --config electron-builder.json --project packages/desktop-electron

      - name: Upload Single-File Windows Executable & Installer
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Windows-Installers
          path: dist-installer/*.exe
