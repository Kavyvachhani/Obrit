name: Build Windows Executable (.exe)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build Core
        run: npm run build --workspace=packages/core

      - name: Build Web Frontend
        run: npm run build --workspace=packages/web

      - name: Build Backend
        run: npm run build --workspace=packages/backend

      - name: Bundle Backend CJS
        run: npx esbuild packages/backend/src/server.ts --bundle --platform=node --target=node18 --format=cjs --outfile=packages/desktop-electron/server-bundle.cjs

      - name: Copy Web Dist to Desktop Electron
        run: |
          mkdir packages\desktop-electron\public
          xcopy /E /I packages\web\dist packages\desktop-electron\public

      - name: Build Windows Standalone Installer & Portable Exe
        run: npx electron-builder --win --x64 --config electron-builder.json --project packages/desktop-electron

      - name: Upload Single-File Windows Executable & Installer
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Windows-Installers
          path: dist-installer/*.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v0.1.0
          name: "Orbit v0.1.0 — Windows Release"
          body: |
            ## Orbit v0.1.0 Windows Release

            ### Recommended Downloads:
            - **[Orbit-Setup-x64.exe](https://github.com/Kavyvachhani/Obrit/releases/download/v0.1.0/Orbit-Setup-x64.exe)** — Recommended 1-Click Installer (Installs app + creates Desktop & Start Menu shortcuts).
            - **[Orbit-Portable-x64.exe](https://github.com/Kavyvachhani/Obrit/releases/download/v0.1.0/Orbit-Portable-x64.exe)** — Standalone portable executable (Zero installation needed, all DLLs bundled directly inside the single .exe).

            Both files are self-contained and eliminate any missing `ffmpeg.dll` or dependency issues.
          draft: false
          prerelease: false
          files: |
            dist-installer/Orbit-Setup-x64.exe
            dist-installer/Orbit-Portable-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
